site_name: ARMxtend
site_url: http://cjferba.github.io/ARMxtend
site_author: Carlos Fernandez-Basso
site_description: A library consisting of useful tools for association rule mining.

repo_url: https://github.com/cjferba/ARMxtend
repo_name: GitHub
edit_uri: docs/user_guide/

#include_search: true # not necessary for this theme
docs_dir: sources

#theme:
#    name: null
#    custom_dir: 'custom_theme/'

markdown_extensions:
  - tables
  - fenced_code

copyright: Copyright &copy; 2016-2026 <a href="http://cjferba.github.com">Carlos Fernandez-Basso</a>

nav:
- Home: index.md
- Installation: installation.md
- Quick Start: quick-start.md
- Examples: examples.md
- Applications: applications.md
- User Guide:
  - USER_GUIDE_INDEX.md
  - Crisp association rules:
    - ARM.association_rules: user_guide/ARM/association_rules.md
    - FFIM (FP-Growth): user_guide/FFIM.md
    - FIM.condensed (closed / maximal): user_guide/FIM/condensed.md
    - ARM.redundancy: user_guide/ARM/redundancy.md
    - ARM.explain (why a rule fires): user_guide/ARM/explain.md
    - ARM.significance (p-values, FDR, permutation tests): user_guide/ARM/significance.md
  - Taxonomies, multilevel and quantitative rules:
    - FIM.taxonomy (item hierarchies, generalized itemsets): user_guide/FIM/taxonomy.md
    - ARM.generalized_rules (multilevel rules, R-interesting): user_guide/ARM/generalized_rules.md
    - ARM.quantitative_rules (merged intervals): user_guide/ARM/quantitative_rules.md
  - Top-k, rare and high-utility rules:
    - ARM.top_k_rules (the k best, no threshold): user_guide/ARM/topk_rules.md
    - ARM.rare_rules (rare combinations of frequent items): user_guide/ARM/rare_rules.md
    - ARM.high_utility_rules (value, not frequency): user_guide/ARM/utility_rules.md
  - Estimators and datasets:
    - estimators (scikit-learn style API): user_guide/estimators.md
    - datasets (generators and examples): user_guide/datasets.md
  - Comparison with mlxtend: user_guide/comparison.md
  - Rules in action:
    - ARM.anomaly (anomalies as rule violations): user_guide/ARM/anomaly_detection.md
    - ARM.prediction (next step / next events): user_guide/ARM/prediction.md
    - ARM.classification (class rules, CBA): user_guide/ARM/classification.md
    - ARM.fuzzy_classification (fuzzy class rules): user_guide/ARM/fuzzy_classification.md
  - Other kinds of rules:
    - ARM.negative_rules (absent items): user_guide/ARM/negative_rules.md
    - ARM.exception_rules (exceptions / anomalies): user_guide/ARM/exception_rules.md
    - ARM.gradual_rules: user_guide/ARM/gradual_rules.md
  - Time series, sensors and sequences:
    - preprocessing.timeseries (items from series): user_guide/preprocessing/timeseries.md
    - ARM.temporal_rules (lagged rules): user_guide/ARM/temporal_rules.md
    - ARM.rule_drift (rules over time): user_guide/ARM/rule_drift.md
    - FIM.sequential (PrefixSpan): user_guide/FIM/sequential.md
    - ARM.sequential_rules: user_guide/ARM/sequential_rules.md
    - FIM.fuzzy_sequential (fuzzy patterns): user_guide/FIM/fuzzy_sequential.md
    - ARM.fuzzy_sequential_rules: user_guide/ARM/fuzzy_sequential_rules.md
  - Fuzzy association rules:
    - FIM.FARE: user_guide/FIM/FARE.md
  - Big Data (Spark) - crisp:
    - FIM.apriori (DApriori/DAprioriTID): user_guide/FIM/apriori.md
    - FIM.Eclat (DECLAT): user_guide/FIM/Eclat.md
    - FIM.BD_ARE: user_guide/FIM/BD_ARE.md
  - Big Data (Spark) - fuzzy:
    - FIM.BD_FARE (FuzzyDAprioriTID): user_guide/FIM/BD_FARE.md
    - FIM.Eclat (FuzzyDECLAT): user_guide/FIM/Eclat.md
  - Streaming (Spark):
    - SFIM / SARE (FIMoTS): user_guide/SARE_SFIM.md
  - Scalability:
    - Spark benchmarks: user_guide/scalability.md
  - Meta-association rules:
    - ARM.meta_rules: user_guide/ARM/meta_rules.md
  - Command line:
    - armxtend: user_guide/cli.md
  - Visualization:
    - VizARM.AREtoGraph: user_guide/VizARM.md
  - Preprocessing:
    - preprocessing.FuzzyLib: user_guide/preprocessing/FuzzyLib.md
- Languages:
  - Español:
    - Inicio: es/index.md
