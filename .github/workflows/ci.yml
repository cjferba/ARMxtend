name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PySpark 4.x requires Python >= 3.9, so 3.8 is excluded here even
        # though the library itself (without the "spark" extra) still
        # supports it per setup.py's python_requires.
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ARMxtend (editable, with the "spark" extra) + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[spark]"
          pip install pytest

      - name: Run the full test suite (Spark algorithms run against tests/spark_stub.py, no cluster/JVM needed)
        run: pytest tests/ ARMxtend/FIM/BD_ARE/TestFunctions.py -v

  docs:
    name: Build documentation (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install mkdocs
        run: pip install mkdocs

      - name: Build the site (fails on broken nav/links)
        run: mkdocs build --strict
        working-directory: docs
