name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and type check (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ARMxtend with the dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "ruff (pyflakes errors - unused or undefined names, syntax)"
        run: ruff check .

      - name: mypy
        run: mypy

  test:
    name: Tests with Spark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PySpark 4.x requires Python >= 3.9
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java (the real-Spark integration tests need a JDK)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install ARMxtend (editable) with the "spark" and "dev" extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[spark,dev]"

      - name: Run the full test suite with coverage
        # Includes the tests that run the Big Data algorithms and the FIMoTS streaming driver on a real
        # local Spark (tests/test_spark_integration.py, test_fimots_streaming.py, test_fimots_drivers.py)
        run: pytest --cov=ARMxtend --cov-report=term-missing --cov-fail-under=80

  core:
    name: Core install without Spark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install only the core dependencies (numpy, pandas, networkx) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: The core must work, and the Spark-dependent tests must be skipped, without pyspark
        run: |
          python -c "import ARMxtend, sys; assert 'pyspark' not in sys.modules"
          pytest -rs

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/armxtend --version
          /tmp/wheel-env/bin/python -c "
          from ARMxtend.VizARM import AREtoGraph
          html = AREtoGraph().to_html()           # the viewer template must ship inside the wheel
          assert 'vizare-data' in html
          import ARMxtend, importlib.resources as r
          assert r.files('ARMxtend').joinpath('py.typed').is_file()"

  docs:
    name: Build documentation (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: pip install mkdocs

      - name: Build the site (fails on broken nav/links)
        run: mkdocs build --strict
        working-directory: docs
